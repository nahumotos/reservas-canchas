server:
  port: 8082

spring:
  application:
    name: reservas-service
  config:
    # Credenciales (RABBITMQ_USER, RABBITMQ_PASSWORD, ...) desde el .env de la raíz del repo, el
    # mismo que usan docker-compose y pagos-service. "optional": si no existe, siguen valiendo las
    # variables de entorno y los valores por defecto.
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/reservas
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:cambiame}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:app}
    password: ${RABBITMQ_PASSWORD:cambiame}
    # El publicador del outbox espera el ack del broker antes de marcar un evento como enviado.
    publisher-confirm-type: correlated
    # Y con mandatory, que el broker le devuelva el mensaje si no llegó a ninguna cola: el ack
    # solo no alcanza, porque RabbitMQ también confirma los mensajes que descarta.
    publisher-returns: true
    listener:
      simple:
        # Un mensaje que falla no vuelve a la cola para siempre: tras los reintentos va a la DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1s
          multiplier: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # Sin esto, springdoc agrega las respuestas del @RestControllerAdvice a todos los endpoints.
  # Cada endpoint documenta sus propios códigos con @ApiResponse.
  override-with-generic-response: false
  # Sin esto Swagger muestra "*/*" como tipo de las respuestas exitosas.
  default-produces-media-type: application/json

canchas-service:
  url: ${CANCHAS_SERVICE_URL:http://localhost:8081}
  # Si canchas-service no contesta en este tiempo, respondemos 503 en vez de colgar el pedido.
  timeout-conexion: 2s
  timeout-lectura: 3s

reservas:
  # Zona de los clubes: define qué es "ahora" para turnos (la JVM corre en UTC).
  zona-horaria: America/Argentina/Buenos_Aires
  # Tiempo que tiene el cliente para pagar antes de que la reserva expire.
  vencimiento-pago: 10m
  # Se puede reservar desde hoy hasta hoy + este número de días.
  anticipacion-maxima-dias: 60
  expiracion:
    # Cada minuto, en el segundo 0. "-" la desactiva (lo usan los tests).
    cron: "0 * * * * *"
  cancelacion:
    # Una reserva CONFIRMADA (pagada) se puede cancelar y reembolsar hasta este tiempo antes del turno.
    anticipacion-minima: 24h

eventos:
  publicacion:
    # Publicación del outbox (evento_saliente) a RabbitMQ. "-" la desactiva (lo usan los tests).
    cron: "* * * * * *"
